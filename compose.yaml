services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: optigym_ver2
      POSTGRES_USER: optigym
      POSTGRES_PASSWORD: ${DB_PASSWORD:-optigym_local}
    ports:
      - "5432:5432"
    volumes:
      - optigym_ver2_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optigym -d optigym_ver2"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/optigym_ver2
      DB_USER: optigym
      DB_PASSWORD: ${DB_PASSWORD:-optigym_local}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@demo.optigym}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeThisAdminPass123!}
      ADMIN_NAME: ${ADMIN_NAME:-OptiGym Admin}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@optigym.vn}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_TARGET: http://backend:8080
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  optigym_ver2_pg:
